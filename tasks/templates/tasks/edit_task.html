
{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Edit Task</title>
    <link rel="stylesheet" href="{% static 'tasks/dashboard.css' %}">
</head>

<body>

    <div class="dashboard-container">

        <div class="task-form">

            <h1>Edit Your Task</h1>

            <form method="POST">
                {% csrf_token %}

                <label>Task Title:</label>
                <input
                    type="text"
                    name="title"
                    value="{{ task.title }}"
                    required
                >

                <label>Description:</label>
                <textarea
                    name="description"
                    required
                >{{ task.description }}</textarea>

                <label>Due Date:</label>
                <input
                    type="date"
                    name="due_date"
                    value="{{ task.due_date|date:'Y-m-d' }}"
                >

                <label>Priority:</label>
                <select name="priority">
                    <option value="Low"
                        {% if task.priority == 'Low' %}selected{% endif %}>
                        Low
                    </option>

                    <option value="Medium"
                        {% if task.priority == 'Medium' %}selected{% endif %}>
                        Medium
                    </option>

                    <option value="High"
                        {% if task.priority == 'High' %}selected{% endif %}>
                        High
                    </option>
                </select>

                <button type="submit">Save Changes</button>

            </form>

            <p>
                <a href="{% url 'task_list' %}">← Back to Tasks</a>
            </p>

        </div>

    </div>

</body>
</html>
